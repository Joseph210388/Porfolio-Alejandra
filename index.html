<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Porfolio | Alejandra Rodríguez</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:wght@300;400;500;700&family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="./public/img/logo.png">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-primary': '#6D9BFF',
                        'brand-dark': '#111827',
                        'brand-light': '#f9fafb',
                    },
                    fontFamily: {
                        'playfair': ['"Dancing Script"', 'cursive'], // Swapped
                        'montserrat': ['"Montserrat"', 'sans-serif'],
                        'dancing': ['"Playfair Display"', 'serif'], // Swapped
                    },
                },
            },
        };
    </script>
    <style>
        html {
            height: 100%;
            overflow: hidden;
        }
        body {
            margin: 0;
            min-height: 100%;
            min-height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            color: #f9fafb;
        }

        /* Base del sitio: mismo #6D9BFF con capas suaves (sin cambiar la marca) */
        .art-page-base {
            background-color: #6D9BFF;
            background-image:
                radial-gradient(ellipse 120% 70% at 0% 0%, rgba(255, 255, 255, 0.12) 0%, transparent 55%),
                radial-gradient(ellipse 80% 55% at 100% 25%, rgba(255, 255, 255, 0.07) 0%, transparent 50%),
                radial-gradient(ellipse 90% 60% at 50% 100%, rgba(90, 130, 230, 0.22) 0%, transparent 48%);
        }

        /* Blob drift animations */
        @keyframes blob-drift-a {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            25%  { transform: translate(28px, -20px) scale(1.05); }
            50%  { transform: translate(14px, 26px) scale(0.96); }
            75%  { transform: translate(-22px, 12px) scale(1.03); }
        }
        @keyframes blob-drift-b {
            0%, 100% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
            33%  { transform: translate(-30px, 18px) scale(1.07) rotate(4deg); }
            66%  { transform: translate(20px, -24px) scale(0.94) rotate(-3deg); }
        }
        @keyframes blob-drift-c {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            40%  { transform: translate(22px, -16px) scale(1.06); }
            80%  { transform: translate(-14px, 22px) scale(0.95); }
        }

        /* Blob base styles */
        .art-blob {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            will-change: transform;
        }
        .art-blob-a {
            width: 560px; height: 520px;
            top: -160px; left: -200px;
            background: radial-gradient(circle at 40% 40%, rgba(255, 165, 100, 0.45) 0%, transparent 68%);
            filter: blur(65px);
            animation: blob-drift-a 26s ease-in-out infinite;
        }
        .art-blob-b {
            width: 640px; height: 500px;
            top: 30%; right: -240px;
            background: radial-gradient(circle at 55% 50%, rgba(110, 230, 180, 0.35) 0%, transparent 65%);
            filter: blur(80px);
            animation: blob-drift-b 34s ease-in-out infinite;
        }
        .art-blob-c {
            width: 500px; height: 560px;
            bottom: -180px; left: 20%;
            background: radial-gradient(circle at 50% 55%, rgba(255, 218, 75, 0.3) 0%, transparent 65%);
            filter: blur(75px);
            animation: blob-drift-c 30s ease-in-out infinite;
        }
        .art-blob-d {
            width: 420px; height: 420px;
            top: 18%; left: 38%;
            background: radial-gradient(circle at 45% 45%, rgba(210, 135, 255, 0.3) 0%, transparent 65%);
            filter: blur(90px);
            animation: blob-drift-a 22s ease-in-out infinite reverse;
        }
        #root {
            min-height: 100%;
            min-height: 100dvh;
        }

        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        /* Hide scrollbar for IE, Edge and Firefox */
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="art-page-base">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
